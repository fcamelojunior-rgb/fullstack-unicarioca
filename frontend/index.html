<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório Full Stack UniCarioca</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Laboratório Full Stack UniCarioca</h1>

    <p class="descricao">
      Consulte os projetos cadastrados na API do laboratório.
    </p>

    <button id="carregar-projetos" type="button">
      Carregar projetos
    </button>

    <p id="mensagem" role="status" aria-live="polite">
      Clique no botão para carregar os projetos.
    </p>

    <ul id="lista-projetos"></ul>
  </main>
</body>
</html>
